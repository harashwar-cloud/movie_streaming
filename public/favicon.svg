<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Romantic Soft Outer Glow -->
    <filter id="pink-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Linear Gradient Primary Pink to Purple -->
    <linearGradient id="love-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4F9A" />
      <stop offset="50%" stop-color="#FF6EB5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Glass Highlights -->
    <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Dark Velvet Rounded Background Square -->
  <rect width="512" height="512" rx="128" fill="#09060F" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#FF4F9A" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Glow Aura -->
  <path 
    d="M256 448 C160 368 64 272 64 176 C64 112 112 64 176 64 C216 64 244 88 256 104 C268 88 296 64 336 64 C400 64 448 112 448 176 C448 272 352 368 256 448 Z" 
    fill="url(#love-gradient)" 
    filter="url(#pink-glow)"
    opacity="0.6"
  />

  <!-- Main 3D Glossy Heart -->
  <path 
    d="M256 432 C160 352 72 260 72 168 C72 108 116 64 176 64 C214 64 242 86 256 102 C270 86 298 64 336 64 C396 64 440 108 440 168 C440 260 352 352 256 432 Z" 
    fill="url(#love-gradient)"
  />

  <!-- Glossy Glass Overlay -->
  <path 
    d="M256 80 C270 96 298 76 336 76 C384 76 424 116 424 168 C424 230 376 300 310 360 C270 320 220 220 220 160 C220 110 240 90 256 80 Z" 
    fill="url(#glass-shine)"
  />

  <!-- High Definition Sparkle Star (Top Right) -->
  <path 
    d="M370 120 L376 138 L394 144 L376 150 L370 168 L364 150 L346 144 L364 138 Z" 
    fill="#FFE600" 
    filter="drop-shadow(0px 0px 8px #FFE600)"
  />
  <path 
    d="M140 200 L143 209 L152 212 L143 215 L140 224 L137 215 L128 212 L137 209 Z" 
    fill="#FFFFFF" 
    opacity="0.9"
  />
</svg>